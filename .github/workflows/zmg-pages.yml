name: ZMG Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zmg-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: zmg-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Publish r8 to gh-pages root
        run: |
          set -e
          curl -fsSL -A "curl/8.0" "https://butyoung-d0gccyj6k32b15fb1-1506892604.tcloudbaseapp.com/index.html" -o index.html
          ls -l index.html
          grep -o "2026.11.03-r8" index.html | head -1
          touch .nojekyll
          git config user.name zmg-bot
          git config user.email zmg-bot@users.noreply.github.com
          git add index.html .nojekyll
          git commit -m "publish r8 to gh-pages [skip ci]" || true
          git push origin HEAD:gh-pages
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${{ github.repository }}/pages/builds -H "Accept: application/vnd.github+json"
          exit 0
