name: ZMG Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zmg-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: zmg-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Checkout patch sources
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src
      - name: Apply r9 patch and verify sha256
        run: |
          set -e
          base64 -d _src/deploy/r9_patch.js.b64 > _src/deploy/r9_patch.run.js
          node _src/deploy/r9_patch.run.js index.html
          ACTUAL=$(sha256sum index.html | awk '{print $1}')
          EXPECTED=$(tr -d '[:space:]' < _src/deploy/r9_expected.txt)
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          grep -o "2026.11.04-r9" index.html | head -1
          touch .nojekyll
      - name: Commit r9 to gh-pages
        run: |
          set -e
          git config user.name zmg-bot
          git config user.email zmg-bot@users.noreply.github.com
          git add index.html .nojekyll
          git commit -m "publish r9 to gh-pages [skip ci]" || true
          git push origin HEAD:gh-pages
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${{ github.repository }}/pages/builds -H "Accept: application/vnd.github+json"
          exit 0
