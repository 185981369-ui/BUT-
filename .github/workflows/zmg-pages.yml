name: ZMG Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zmg-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Fetch app
        run: |
          mkdir -p site
          curl -fsSL -A "curl/8.0" "https://butyoung-d0gccyj6k32b15fb1-1506892604.tcloudbaseapp.com/index.html" -o site/index.html
          ls -l site/index.html
          head -c 120 site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
