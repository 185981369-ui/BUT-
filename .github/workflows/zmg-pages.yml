name: ZMG Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zmg-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: zmg-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Checkout patch sources
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src
      - name: Apply r14 patch and verify sha256
        run: |
          set -e
          cat _src/deploy/r14_chunks/c0{1..3}.txt | tr -d '\r\n ' > /tmp/r14_patch.json.gz.b64
          base64 -d /tmp/r14_patch.json.gz.b64 | gunzip > _src/deploy/r14_patch.json
          base64 -w0 _src/deploy/r14_patch.json > _src/deploy/r14_patch.b64
          node _src/deploy/r14_patch.js index.html
          ACTUAL=$(sha256sum index.html | awk '{print $1}')
          EXPECTED=$(tr -d '[:space:]' < _src/deploy/r14_expected.txt)
          echo "actual=$ACTUAL expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          grep -o "2026.11.05-r14" index.html | head -1
          touch .nojekyll
      - name: Commit r14 to gh-pages
        run: |
          set -e
          git config user.name zmg-bot
          git config user.email zmg-bot@users.noreply.github.com
          git add index.html .nojekyll
          git commit -m "publish r14 to gh-pages [skip ci]" || true
          git push origin HEAD:gh-pages
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${{ github.repository }}/pages/builds -H "Accept: application/vnd.github+json"
          exit 0
