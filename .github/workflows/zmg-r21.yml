name: ZMG Pages R21
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zmg-r21.yml'
      - 'deploy/r21_prod_patch.js'
      - 'deploy/r21_trial_patch.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zmg-r21
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Checkout patch sources
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src
      - name: Apply r21 to index.html and trial.html
        run: |
          set -e
          node _src/deploy/r21_prod_patch.js index.html
          node _src/deploy/r21_trial_patch.js trial.html
          A1=$(sha256sum index.html | awk '{print $1}')
          E1=$(tr -d '[:space:]' < _src/deploy/r21_prod_expected.txt)
          A2=$(sha256sum trial.html | awk '{print $1}')
          E2=$(tr -d '[:space:]' < _src/deploy/r21_trial_expected.txt)
          echo "prod=$A1 trial=$A2"
          test "$A1" = "$E1"
          test "$A2" = "$E2"
          grep -o "2026.11.06-r21" index.html | head -1
          touch .nojekyll
      - name: Commit r21 to gh-pages
        run: |
          set -e
          git config user.name zmg-bot
          git config user.email zmg-bot@users.noreply.github.com
          git add index.html trial.html .nojekyll
          git commit -m "publish r21 to gh-pages [skip ci]" || true
          git push origin HEAD:gh-pages
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST repos/${{ github.repository }}/pages/builds -H "Accept: application/vnd.github+json"
          exit 0
